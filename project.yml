name: Lantern
options:
  deploymentTarget:
    macOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    ARCHS: arm64
    PRODUCT_BUNDLE_IDENTIFIER: com.builtbymagnus.lantern
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '2'
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Resources/Info.plist
    COMBINE_HIDPI_IMAGES: NO
    LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/../Frameworks'
targets:
  Lantern:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
          - run_command.py
          - __pycache__
          - Pip-frames
      - path: Resources/Pip-frames
        type: folder
        buildPhase: resources
    postBuildScripts:
      - name: Embed local inference and command engines
        script: '"$SRCROOT/script/embed_runtime.sh" "$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME"'
        basedOnDependencyAnalysis: false
    scheme:
      gatherCoverageData: false
      archive:
        config: Release
